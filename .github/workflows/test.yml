name: Run tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        working-directory: Mvp01
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: Mvp01
        run: pytest